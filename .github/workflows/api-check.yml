name: API check
on:
  push:
    paths: [".github/workflows/api-check.yml"]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Query radio-browser
        run: |
          UA="UtahRadio/1.4 (Android)"
          note() { echo "::notice::$1"; }
          for h in de1 nl1 at1 de2 fi1 all; do
            code=$(curl -s -o /tmp/s.json -w '%{http_code}' -m 20 -A "$UA" "https://$h.api.radio-browser.info/json/stats" || echo ERR)
            note "server $h -> $code $(head -c 120 /tmp/s.json | tr -d '\n')"
          done
          srv=$(curl -s -m 20 -A "$UA" https://all.api.radio-browser.info/json/servers | head -c 600 | tr -d '\n')
          note "servers list: $srv"
          for h in de1 de2 fi1 all; do
            for q in \
              "search?countrycode=US&has_geo_info=true&hidebroken=true&order=clickcount&reverse=true&limit=4000" \
              "search?countrycode=US&state=Utah&hidebroken=true&order=clickcount&reverse=true&limit=600" \
              "search?tag=adult%20contemporary&countrycode=US&hidebroken=true&order=clickcount&reverse=true&limit=800" \
              "search?name=KSL&hidebroken=true&order=clickcount&reverse=true&limit=150"; do
              code=$(curl -s -o /tmp/r.json -w '%{http_code} %{time_total}s %{size_download}B' -m 40 -A "$UA" "https://$h.api.radio-browser.info/json/$q" || echo ERR)
              n=$(python3 -c "import json;d=json.load(open('/tmp/r.json'));print(len(d), sum(1 for x in d if x.get('geo_lat')), [x['name'] for x in d if 'utah' in (x.get('state') or '').lower()][:5])" 2>&1 | tail -c 300)
              note "$h $q -> $code count/geo/utah: $n"
            done
          done
