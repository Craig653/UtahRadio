name: Build APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Build
        run: ./gradlew assembleRelease --no-daemon
      - name: Rename APK
        run: cp app/build/outputs/apk/release/app-release.apk UtahRadio.apk
      - uses: actions/upload-artifact@v4
        with:
          name: UtahRadio-apk
          path: UtahRadio.apk
      - name: Publish download (Releases page)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Utah Radio (build ${{ github.run_number }})
          make_latest: true
          files: UtahRadio.apk
          body: Tap **UtahRadio.apk** below on your phone to download and install.
